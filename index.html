<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>弾幕拠点破壊 ─ 死にゲー</title>
<style>
  html,body{
    margin:0;height:100%;background:#07090d;overflow:hidden;
    font-family:system-ui,'Segoe UI',sans-serif;
    -webkit-user-select:none;user-select:none;
  }
  #c{display:block;position:absolute;left:0;top:0;cursor:crosshair;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

const TAU = Math.PI * 2;

// ============================================================
//  難易度
// ============================================================
const DIFFICULTY = [
  { key:'EASY',    label:'弾幕 少なめ', note:'のんびりいこう',      mult:0.62, color:'#7cf5c4' },
  { key:'NORMAL',  label:'弾幕 普通',   note:'標準的な地獄',        mult:1.00, color:'#ffd24a' },
  { key:'LUNATIC', label:'弾幕 激ムズ', note:'※ ブチギレても責任は負いません。', mult:1.65, color:'#ff4a6e' }
];
let diffIndex = 1;
const dmult = () => DIFFICULTY[diffIndex].mult;

// 戦車の数（難易度別）
const TANK_COUNTS = [2, 4, 10];

// 戦車のパラメータ
const TANK_HP = 260;
const TANK_SPEED = 111;
const TANK_RANGE = 280;
const TANK_DAMAGE = 45;
const TANK_RELOAD = 1.6;
const TANK_SHELL_SPEED = 420;
const TANK_SHELL_RADIUS = 6;
const TANK_SHELL_LIFE = TANK_RANGE / TANK_SHELL_SPEED;
const TANK_ALLY_R = 16;
const TANK_PLAYER_R = 18;

// ============================================================
//  戦車の配色（原色の光）
// ============================================================
// 味方戦車：青い光のエネルギー体
const ALLY_TANK_COLORS = {
  glow:       'rgba(40,130,255,0.34)',
  hullFill:   'rgba(40,110,230,0.20)',
  hullLine:   '#5fb0ff',
  hullInner:  'rgba(170,225,255,0.60)',
  trackGlow:  'rgba(40,120,255,0.30)',
  trackLine:  '#8fd8ff',
  dash:       'rgba(225,248,255,0.95)',
  turretFill: 'rgba(60,140,255,0.30)',
  turretLine: '#a9e4ff',
  barrel:     '#cdeeff',
  barrelGlow: 'rgba(70,160,255,0.50)',
  hatch:      '#eefaff',
  hpRing:     '#7fd0ff'
};

// プレイヤー戦車：黄色い光のエネルギー体
const PLAYER_TANK_COLORS = {
  glow:       'rgba(255,205,30,0.36)',
  hullFill:   'rgba(235,180,0,0.20)',
  hullLine:   '#ffd83a',
  hullInner:  'rgba(255,248,190,0.65)',
  trackGlow:  'rgba(255,190,0,0.30)',
  trackLine:  '#ffe98f',
  dash:       'rgba(255,255,225,0.95)',
  turretFill: 'rgba(255,200,20,0.32)',
  turretLine: '#fff2a8',
  barrel:     '#fff8cc',
  barrelGlow: 'rgba(255,200,40,0.55)',
  hatch:      '#ffffff',
  hpRing:     '#ffd83a'
};

// ============================================================
//  画面サイズ / フルスクリーン / ズーム
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 960, H = 600;
let PANEL_W = 240;
let VIEW_W = 720, VIEW_H = 600;
let DPR = 1;
let ZOOM = 1;

function resize() {
  W = Math.max(560, window.innerWidth);
  H = Math.max(380, window.innerHeight);
  PANEL_W = Math.round(Math.min(330, Math.max(168, W * 0.19)));
  VIEW_W = W - PANEL_W;
  VIEW_H = H;

  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  ZOOM = Math.max(1, VIEW_W / 1600, VIEW_H / 1000);
  if (G) clampCamera();
}
window.addEventListener('resize', resize);

function toggleFullscreen() {
  const el = document.documentElement;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (!fsEl) {
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}
document.addEventListener('fullscreenchange', () => setTimeout(resize, 60));
document.addEventListener('webkitfullscreenchange', () => setTimeout(resize, 60));

// ============================================================
//  定数
// ============================================================
const WORLD_W = 2400, WORLD_H = 1600;
const SPAWN_X = 100, SPAWN_Y = WORLD_H / 2;
const BASE_X = WORLD_W - 400, BASE_Y = WORLD_H / 2;

const ALLY_CAP = 120;
const DODGER_RATIO = 0.35;
const IFRAME = 0.30;

const LASER_LEN = 3000;
const BULLET_CAP = 1800;

// ============================================================
//  入力
// ============================================================
const keys = Object.create(null);
const mouse = { x: 0, y: 0 };
let mouseDown = false;

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();

  if (e.code === 'KeyF') { e.preventDefault(); toggleFullscreen(); return; }
  if (!G) return;

  if (G.state === 'menu') {
    if (e.code === 'Digit1' || e.code === 'Numpad1') { diffIndex = 0; startGame(); }
    else if (e.code === 'Digit2' || e.code === 'Numpad2') { diffIndex = 1; startGame(); }
    else if (e.code === 'Digit3' || e.code === 'Numpad3') { diffIndex = 2; startGame(); }
    else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { diffIndex = (diffIndex + 2) % 3; }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') { diffIndex = (diffIndex + 1) % 3; }
    else if (e.code === 'Enter' || e.code === 'Space') { startGame(); }
    return;
  }

  if (e.code === 'KeyR' && G.over) reset();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
  if (!G) return;

  if (G.state === 'menu') {
    const btns = menuButtons();
    for (let i = 0; i < 3; i++) {
      const b = btns[i];
      if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) {
        diffIndex = i;
        return;
      }
    }
    const sb = startButtonRect();
    if (mouse.x >= sb.x && mouse.x <= sb.x + sb.w && mouse.y >= sb.y && mouse.y <= sb.y + sb.h) {
      startGame();
    }
    return;
  }

  if (mouse.x < VIEW_W) mouseDown = true;
});
window.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
//  ユーティリティ
// ============================================================
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const rand = (a, b) => a + Math.random() * (b - a);
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx*dx + dy*dy; };
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

function lerpAngle(a, b, t) {
  return a + angDiff(b, a) * Math.min(1, t);
}

function camViewW() { return VIEW_W / ZOOM; }
function camViewH() { return VIEW_H / ZOOM; }

function clampCam(v, viewSize, worldSize) {
  const m = worldSize - viewSize;
  return m <= 0 ? m / 2 : clamp(v, 0, m);
}
function clampCamera() {
  if (!G) return;
  G.cam.x = clampCam(G.cam.x, camViewW(), WORLD_W);
  G.cam.y = clampCam(G.cam.y, camViewH(), WORLD_H);
}

function clipLineToRect(ox, oy, dx, dy, x0, y0, x1, y1, maxT) {
  let tMin = -maxT, tMax = maxT;

  if (Math.abs(dx) < 1e-9) {
    if (ox < x0 || ox > x1) return null;
  } else {
    const inv = 1 / dx;
    let t1 = (x0 - ox) * inv, t2 = (x1 - ox) * inv;
    if (t1 > t2) { const tt = t1; t1 = t2; t2 = tt; }
    if (t1 > tMin) tMin = t1;
    if (t2 < tMax) tMax = t2;
  }

  if (Math.abs(dy) < 1e-9) {
    if (oy < y0 || oy > y1) return null;
  } else {
    const inv = 1 / dy;
    let t1 = (y0 - oy) * inv, t2 = (y1 - oy) * inv;
    if (t1 > t2) { const tt = t1; t1 = t2; t2 = tt; }
    if (t1 > tMin) tMin = t1;
    if (t2 < tMax) tMax = t2;
  }

  if (tMin > tMax) return null;
  return [tMin, tMax];
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// ============================================================
//  砲塔の定義
// ============================================================
const TURRET_STYLES = {
  burst: {
    burst: 6, interval: 0.045, reload: 1.85,
    spd: 260, dmg: 12, r: 4.5, spread: 0.07, color: '#ff9c4a', hp: 700
  },
  sweep: {
    burst: 9, interval: 0.042, reload: 2.1,
    spd: 245, dmg: 10, r: 4, spread: 0, sweepArc: 0.75, color: '#ffd24a', hp: 700
  },
  heavy: {
    burst: 4, interval: 0.05, reload: 1.95,
    spd: 205, dmg: 22, r: 6, spread: 0.09, color: '#ff4a22', hp: 900
  },
  suppress: {
    burst: 13, interval: 0.042, reload: 2.3,
    spd: 300, dmg: 8, r: 3.5, spread: 0.17, color: '#ffcc44', hp: 650
  }
};

function makeTurret(x, y, style) {
  const s = TURRET_STYLES[style];
  return {
    kind:'turret', x, y, r: 20, hp: s.hp, maxhp: s.hp, flash: 0,
    style, cd: rand(0.4, 1.6),
    burstLeft: 0, burstTimer: 0,
    aimAng: 0, sweepBase: 0, sweepDir: 1,
    muzzle: 0,
    burstCount: Math.max(3, Math.round(s.burst * dmult()))
  };
}

// ============================================================
//  状態
// ============================================================
let G = null;

function makePlayer() {
  return {
    kind: 'player', isTank: false, x: SPAWN_X, y: SPAWN_Y, r: 12,
    hp: 100, maxhp: 100, speed: 132,
    vx: 0, vy: 0,
    aim: 0, atkCd: 0, swing: 0, swingAng: 0,
    invuln: 1.2, flash: 0
  };
}

function makePlayerTank() {
  return {
    kind: 'player', isTank: true, x: SPAWN_X, y: SPAWN_Y, r: TANK_PLAYER_R,
    hp: 340, maxhp: 340, speed: 111,
    vx: 0, vy: 0,
    aim: 0, hullAng: 0,
    reload: 0, muzzle: 0, trackPhase: 0,
    invuln: 1.2, flash: 0, noTargetTimer: 0
  };
}

function makeAlly() {
  const dodger = Math.random() < DODGER_RATIO;
  return {
    kind: 'ally', x: SPAWN_X, y: SPAWN_Y, r: 9,
    hp: 25, maxhp: 25,
    speed: dodger ? 118 : 95,
    dodger,
    vx: 0, vy: 0,
    atkCd: rand(0, 0.6), swing: 0, swingAng: 0,
    invuln: rand(0, 0.4), flash: 0
  };
}

function makeTankAlly() {
  return {
    kind: 'tank', x: SPAWN_X, y: SPAWN_Y, r: TANK_ALLY_R,
    hp: TANK_HP, maxhp: TANK_HP, speed: TANK_SPEED,
    vx: 0, vy: 0,
    aim: 0, hullAng: 0,
    reload: rand(0, 1.0), muzzle: 0, trackPhase: rand(0, 10),
    invuln: rand(0, 0.4), flash: 0
  };
}

function reset() {
  G = {
    state: 'menu',
    t: 0,
    allyDeaths: 0,
    playerDeaths: 0,
    player: null,
    playerRespawn: 0,
    allies: [],
    cam: { x: 0, y: 0 },

    wave: 0,
    waveTimer: 8.0,
    waveInterval: 8.0,
    waveBanner: 0,

    bullets: [],
    shells: [],
    orbs: [],
    warnings: [],
    lasers: [],
    particles: [],

    core: {
      kind: 'core', x: BASE_X, y: BASE_Y, r: 12,
      hp: 5000, maxhp: 5000, flash: 0, pulse: 0,
      speed: 155, vx: 0, vy: 0,
      wanderT: 0, wanderA: 0,
      spiralLeft: 0, spiralAng: 0, spiralTimer: 0,
      timers: { orb: 2.2, lightning: 3.0, aimed: 1.4, laser: 6.5, ring: 4.0, spiral: 7.0 }
    },
    turrets: [
      makeTurret(1620, 380,  'burst'),
      makeTurret(1620, 1220, 'burst'),
      makeTurret(1820, 240,  'sweep'),
      makeTurret(1820, 1360, 'sweep'),
      makeTurret(1900, 800,  'suppress'),
      makeTurret(2060, 500,  'heavy'),
      makeTurret(2060, 1100, 'heavy'),
    ],

    over: false, win: false, overT: 0
  };

  G.player = makePlayer();
  G.cam.x = clampCam(G.player.x - camViewW() / 2, camViewW(), WORLD_W);
  G.cam.y = clampCam(G.player.y - camViewH() / 2, camViewH(), WORLD_H);
}

function startGame() {
  reset();
  G.state = 'playing';
  G.wave = 1;
  G.waveInterval = 8.0;
  G.waveTimer = 8.0;
  spawnWave(Math.round(25 * Math.max(1, dmult())));
  spawnTanksToCap();
  last = performance.now();
}

// ============================================================
//  対象取得
// ============================================================
function friendlies() {
  const a = [];
  if (G.player) a.push(G.player);
  for (const al of G.allies) if (al.hp > 0) a.push(al);
  return a;
}
function enemiesAlive() {
  const a = [];
  for (const t of G.turrets) if (t.hp > 0) a.push(t);
  if (G.core.hp > 0) a.push(G.core);
  return a;
}

// ============================================================
//  回避ベクトル計算
// ============================================================
function getDodgeVector(a) {
  let dx = 0, dy = 0;

  for (const b of G.bullets) {
    const ex = a.x - b.x, ey = a.y - b.y;
    const d2 = ex*ex + ey*ey;
    if (d2 > 90000) continue;
    const bs2 = b.vx*b.vx + b.vy*b.vy;
    if (bs2 < 1) continue;
    const bs = Math.sqrt(bs2);
    const bnx = b.vx / bs, bny = b.vy / bs;
    const proj = ex*bnx + ey*bny;
    if (proj <= 0 || proj > 320) continue;
    const perp = Math.abs(ex*bny - ey*bnx);
    if (perp > b.r + a.r + 16) continue;
    const tti = proj / bs;
    if (tti > 1.2) continue;
    const px = -bny, py = bnx;
    if (px*ex + py*ey > 0) { dx += px; dy += py; }
    else { dx -= px; dy -= py; }
  }

  for (const o of G.orbs) {
    const ex = a.x - o.x, ey = a.y - o.y;
    const d2 = ex*ex + ey*ey;
    if (d2 > 6400) continue;
    const d = Math.sqrt(d2);
    if (d < 1) continue;
    const str = 1 + (80 - d) / 80;
    dx += (ex/d) * str;
    dy += (ey/d) * str;
  }

  for (const w of G.warnings) {
    if (w.phase !== 'warn') continue;
    const ex = a.x - w.x, ey = a.y - w.y;
    const d = Math.hypot(ex, ey);
    const dangerR = w.r + a.r + 20;
    if (d > dangerR) continue;
    if (d < 1) { dx += 1; dy += 0; }
    else {
      const str = 1 + (dangerR - d) / dangerR * 2;
      dx += (ex/d) * str;
      dy += (ey/d) * str;
    }
  }

  for (const L of G.lasers) {
    if (L.phase !== 'warn') continue;
    const ex = a.x - L.ox, ey = a.y - L.oy;
    const sinA = Math.sin(L.ang), cosA = Math.cos(L.ang);
    const perp = -ex * sinA + ey * cosA;
    const danger = L.w / 2 + a.r + 20;
    if (Math.abs(perp) > danger) continue;
    const str = 1 + (danger - Math.abs(perp)) / danger * 2;
    const nx = -sinA, ny = cosA;
    const sgn = perp > 0 ? 1 : -1;
    dx += nx * sgn * str;
    dy += ny * sgn * str;
  }

  return { x: dx, y: dy };
}

// ============================================================
//  ダメージ
// ============================================================
function hurtFriendly(f, dmg) {
  if (!f || f.hp <= 0 || f.invuln > 0) return;
  f.hp -= dmg;
  f.invuln = IFRAME;
  f.flash = 0.13;
  burst(f.x, f.y, 4, '#ff7a7a', 90);
  if (f.hp <= 0) {
    f.hp = 0;
    burst(f.x, f.y, 14, '#ff5a5a', 190);
    if (f.kind === 'player') {
      G.playerDeaths++;
      G.player = null;
      G.playerRespawn = 2.0;
      shake(10);
    } else {
      G.allyDeaths++;
      shake(2);
    }
  }
}

function hurtEnemy(e, dmg) {
  if (e.hp <= 0) return;
  e.hp -= dmg;
  e.flash = 0.1;
  if (e.hp <= 0) {
    e.hp = 0;
    burst(e.x, e.y, e.kind === 'core' ? 60 : 22, '#ffc24a', e.kind === 'core' ? 320 : 210);
    shake(e.kind === 'core' ? 22 : 7);
    if (e.kind === 'core') { G.over = true; G.win = true; G.overT = 0; }
  }
}

// ============================================================
//  近接
// ============================================================
function meleeSweep(attacker, angle, range, halfArc, dmg) {
  for (const e of enemiesAlive()) {
    const d = Math.hypot(e.x - attacker.x, e.y - attacker.y) - e.r;
    if (d > range) continue;
    const a = Math.atan2(e.y - attacker.y, e.x - attacker.x);
    if (Math.abs(angDiff(a, angle)) > halfArc) continue;
    hurtEnemy(e, dmg);
    burst((e.x + attacker.x) / 2, (e.y + attacker.y) / 2, 3, '#bff', 120);
  }
}

// ============================================================
//  戦車の砲弾（光弾）
// ============================================================
function fireTankShell(tank) {
  const ang = tank.aim;
  const mx = tank.x + Math.cos(ang) * 34;
  const my = tank.y + Math.sin(ang) * 34;
  G.shells.push({
    x: mx, y: my,
    vx: Math.cos(ang) * TANK_SHELL_SPEED,
    vy: Math.sin(ang) * TANK_SHELL_SPEED,
    r: TANK_SHELL_RADIUS, dmg: TANK_DAMAGE, life: TANK_SHELL_LIFE, dead: false
  });
  burst(mx, my, 6, '#fff6b0', 220);
}

function updateShells(dt) {
  const enemies = enemiesAlive();
  for (const s of G.shells) {
    if (s.dead) continue;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt;
    if (s.life <= 0) { s.dead = true; continue; }
    for (const e of enemies) {
      if (e.hp <= 0) continue;
      if (dist2(s, e) < (s.r + e.r) * (s.r + e.r)) {
        hurtEnemy(e, s.dmg);
        burst(s.x, s.y, 12, '#ffe9a0', 250);
        shake(3);
        s.dead = true;
        break;
      }
    }
  }
  G.shells = G.shells.filter(s => !s.dead);
}

// ============================================================
//  パーティクル / シェイク
// ============================================================
let shakeAmt = 0, shakeT = 0;
function shake(v) { shakeAmt = Math.max(shakeAmt, v); shakeT = 0.25; }
function burst(x, y, n, color, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU;
    const s = spd * (0.25 + Math.random() * 0.85);
    G.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(0.25, 0.65), max: 0.65, color, r: rand(1.5, 3.5)
    });
  }
}

// ============================================================
//  波状攻撃
// ============================================================
function spawnWave(n) {
  let alive = 0;
  for (const a of G.allies) if (a.hp > 0 && a.kind !== 'tank') alive++;
  const canSpawn = Math.max(0, Math.min(n, ALLY_CAP - alive));
  for (let i = 0; i < canSpawn; i++) {
    const a = makeAlly();
    a.x = clamp(SPAWN_X + rand(-60, 60), 20, WORLD_W - 20);
    a.y = clamp(SPAWN_Y + rand(-500, 500), 20, WORLD_H - 20);
    G.allies.push(a);
  }
}

function spawnTanksToCap() {
  const cap = TANK_COUNTS[diffIndex];
  let alive = 0;
  for (const a of G.allies) if (a.kind === 'tank' && a.hp > 0) alive++;
  const need = Math.max(0, cap - alive);
  for (let i = 0; i < need; i++) {
    const t = makeTankAlly();
    t.x = clamp(SPAWN_X + rand(-80, 80), 20, WORLD_W - 20);
    t.y = clamp(SPAWN_Y + rand(-400, 400), 20, WORLD_H - 20);
    G.allies.push(t);
  }
}

function updateWaves(dt) {
  G.waveTimer -= dt;
  if (G.waveTimer <= 0) {
    G.wave++;
    const n = Math.round((14 + G.wave * 4) * Math.max(1, dmult()));
    spawnWave(n);
    spawnTanksToCap();
    G.waveBanner = 2.5;
    G.waveInterval = Math.max(5.5, 10.0 - G.wave * 0.25);
    G.waveTimer = G.waveInterval;
  }
}

// ============================================================
//  コアの攻撃
// ============================================================
function fireOrbs(c) {
  const m = dmult();
  const n = Math.max(6, Math.round(10 * m));
  const base = Math.random() * TAU;
  for (let i = 0; i < n; i++) {
    G.orbs.push({
      a: base + i * (TAU / n), angSpeed: 1.1,
      rad: 120, radSpeed: 36, r: 9, dmg: 20, life: 9
    });
  }
  const n2 = Math.max(6, Math.round(10 * m));
  for (let i = 0; i < n2; i++) {
    G.orbs.push({
      a: -base + i * (TAU / n2) + 0.32, angSpeed: -1.55,
      rad: 60, radSpeed: 74, r: 7, dmg: 14, life: 7
    });
  }
  shake(3);
}

function fireLightning(c) {
  const m = dmult();
  const targets = [];
  if (G.player) targets.push(G.player);
  const maxT = Math.max(3, Math.round(6 * m));
  const pool = G.allies.filter(a => a.hp > 0).sort(() => Math.random() - 0.5);
  for (const a of pool) { if (targets.length >= maxT) break; targets.push(a); }
  for (const t of targets) {
    const px = clamp(t.x + (t.vx || 0) * 0.7, 20, WORLD_W - 20);
    const py = clamp(t.y + (t.vy || 0) * 0.7, 20, WORLD_H - 20);
    G.warnings.push({
      x: px, y: py, r: 58, t: 0.95, max: 0.95, phase: 'warn',
      sx: c.x, sy: c.y
    });
  }
}

function fireAimed(c) {
  const m = dmult();
  const targets = [];
  if (G.player) targets.push(G.player);
  const maxT = Math.max(3, Math.round(5 * m));
  const pool = G.allies.filter(a => a.hp > 0).sort(() => Math.random() - 0.5);
  for (const a of pool) { if (targets.length >= maxT) break; targets.push(a); }
  const ways = m > 1.2 ? 5 : 3;
  for (const t of targets) {
    const base = Math.atan2(t.y - c.y, t.x - c.x);
    const sp = 280;
    for (let k = -(ways >> 1); k <= (ways >> 1); k++) {
      const a = base + k * 0.10;
      G.bullets.push({
        x: c.x + Math.cos(a) * (c.r + 6),
        y: c.y + Math.sin(a) * (c.r + 6),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: 5, dmg: 16, life: 6, color: '#ff6fb5'
      });
    }
  }
}

function densestDirection(c, list) {
  if (!list || list.length === 0) return Math.random() * TAU;

  const STEPS = 96;
  const HALF = 0.40;
  let bestAng = 0, bestScore = -1;

  for (let i = 0; i < STEPS; i++) {
    const a = i * TAU / STEPS;
    let score = 0;
    for (const f of list) {
      const d = Math.hypot(f.x - c.x, f.y - c.y);
      if (d < 1) { score += 1; continue; }
      const ang = Math.atan2(f.y - c.y, f.x - c.x);
      const diff = Math.abs(angDiff(ang, a));
      if (diff < HALF) {
        score += (1 - diff / HALF) * (1 / (1 + d / 700));
      }
    }
    if (score > bestScore) { bestScore = score; bestAng = a; }
  }
  return bestAng;
}

function pushLaser(ox, oy, ang, delay, w) {
  G.lasers.push({
    ang, ox, oy,
    t: delay, max: delay, phase: 'warn', w
  });
}

function fireLasers(c) {
  const list = friendlies();
  const main = densestDirection(c, list);
  const m = dmult();

  pushLaser(c.x, c.y, main, 1.05, 26);
  pushLaser(c.x, c.y, main + Math.PI / 2, 1.35, 26);

  if (m > 1.2) {
    const nx = -Math.sin(main), ny = Math.cos(main);
    const off = 150;
    pushLaser(c.x + nx * off, c.y + ny * off, main, 1.65, 22);
    pushLaser(c.x - nx * off, c.y - ny * off, main, 1.65, 22);
  }

  shake(4);
}

function fireRing(c) {
  const m = dmult();
  const base = Math.random() * TAU;

  const n1 = Math.max(12, Math.round(22 * m)), sp1 = 175;
  for (let i = 0; i < n1; i++) {
    const a = base + i * (TAU / n1);
    G.bullets.push({
      x: c.x + Math.cos(a) * (c.r + 4),
      y: c.y + Math.sin(a) * (c.r + 4),
      vx: Math.cos(a) * sp1, vy: Math.sin(a) * sp1,
      r: 6, dmg: 16, life: 5.5, color: '#ff9b3d'
    });
  }
  const n2 = Math.max(10, Math.round(16 * m)), sp2 = 110;
  for (let i = 0; i < n2; i++) {
    const a = base + (i + 0.5) * (TAU / n2);
    G.bullets.push({
      x: c.x + Math.cos(a) * (c.r + 4),
      y: c.y + Math.sin(a) * (c.r + 4),
      vx: Math.cos(a) * sp2, vy: Math.sin(a) * sp2,
      r: 7, dmg: 18, life: 6.5, color: '#ffb24a'
    });
  }
  shake(4);
}

function fireSpiralShot(c) {
  const m = dmult();
  const ways = Math.min(4, Math.max(2, Math.round(3 * m)));
  const sp = 205;
  for (let k = 0; k < ways; k++) {
    const a = c.spiralAng + k * (TAU / ways);
    G.bullets.push({
      x: c.x + Math.cos(a) * (c.r + 4),
      y: c.y + Math.sin(a) * (c.r + 4),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: 4.5, dmg: 14, life: 5.0, color: '#c78bff'
    });
  }
}

function fireTurretShot(t) {
  const s = TURRET_STYLES[t.style];
  let ang, dmg, r, spd, color;

  if (t.style === 'sweep') {
    const k = 1 - t.burstLeft / t.burstCount;
    ang = t.sweepBase + (k - 0.5) * s.sweepArc * t.sweepDir;
    spd = s.spd; dmg = s.dmg; r = s.r; color = s.color;
  } else {
    ang = t.aimAng + rand(-s.spread, s.spread);
    spd = s.spd; dmg = s.dmg; r = s.r; color = s.color;
  }

  const mx = t.x + Math.cos(ang) * (t.r + 8);
  const my = t.y + Math.sin(ang) * (t.r + 8);

  G.bullets.push({
    x: mx, y: my,
    vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
    r, dmg, life: 4, pierce: false, color,
    tracer: t.style === 'heavy' ? 22 : 14,
    fromTurret: true
  });

  t.muzzle = 0.07;
  if (t.style === 'heavy') shake(1.5);
  else if (Math.random() < 0.2) shake(0.5);
}

function updateTurrets(dt) {
  for (const t of G.turrets) {
    if (t.hp <= 0) continue;
    const s = TURRET_STYLES[t.style];
    t.flash = Math.max(0, t.flash - dt);
    t.muzzle = Math.max(0, t.muzzle - dt);

    if (t.burstLeft > 0) {
      t.burstTimer -= dt;
      if (t.burstTimer <= 0) {
        t.burstTimer = s.interval / Math.max(1, dmult() * 0.85);
        fireTurretShot(t);
        t.burstLeft--;
        if (t.burstLeft <= 0) t.cd = s.reload / dmult();
      }
    } else {
      t.cd -= dt;
      if (t.cd <= 0) {
        const list = friendlies();
        if (list.length === 0) { t.cd = 0.5; continue; }
        let best = null, bd = Infinity;
        for (const f of list) {
          const dd = dist2(f, t);
          if (dd < bd) { bd = dd; best = f; }
        }
        t.aimAng = Math.atan2(best.y - t.y, best.x - t.x);
        t.sweepBase = t.aimAng;
        t.sweepDir = Math.random() < 0.5 ? 1 : -1;
        t.burstLeft = t.burstCount;
        t.burstTimer = 0;
      }
    }
  }
}

function updatePlayer(dt) {
  if (!G.player) {
    G.playerRespawn -= dt;
    if (G.playerRespawn <= 0) {
      if (Math.random() < 0.45) G.player = makePlayerTank();
      else G.player = makePlayer();
    }
    return;
  }
  const p = G.player;
  p.invuln = Math.max(0, p.invuln - dt);
  p.flash = Math.max(0, p.flash - dt);

  let dx = 0, dy = 0;
  if (keys.KeyA || keys.ArrowLeft) dx--;
  if (keys.KeyD || keys.ArrowRight) dx++;
  if (keys.KeyW || keys.ArrowUp) dy--;
  if (keys.KeyS || keys.ArrowDown) dy++;

  if (dx || dy) {
    const l = Math.hypot(dx, dy);
    p.vx = dx / l * p.speed;
    p.vy = dy / l * p.speed;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  } else { p.vx = 0; p.vy = 0; }

  p.x = clamp(p.x, p.r, WORLD_W - p.r);
  p.y = clamp(p.y, p.r, WORLD_H - p.r);

  const mxv = clamp(mouse.x, 0, VIEW_W);
  const myv = clamp(mouse.y, 0, VIEW_H);
  const wmx = mxv / ZOOM + G.cam.x;
  const wmy = myv / ZOOM + G.cam.y;
  p.aim = Math.atan2(wmy - p.y, wmx - p.x);

  if (p.isTank) {
    if (p.vx || p.vy) {
      const moveAng = Math.atan2(p.vy, p.vx);
      p.hullAng = lerpAngle(p.hullAng, moveAng, dt * 8);
    }
    p.trackPhase += Math.hypot(p.vx, p.vy) * dt * 0.12;
    p.reload = Math.max(0, p.reload - dt);
    p.muzzle = Math.max(0, p.muzzle - dt);
    p.noTargetTimer = Math.max(0, p.noTargetTimer - dt);

    if ((mouseDown || keys.Space) && p.reload <= 0) {
      const enemies = enemiesAlive();
      let canFire = false;
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        const d = Math.hypot(e.x - p.x, e.y - p.y);
        if (d > TANK_RANGE + e.r) continue;
        const angTo = Math.atan2(e.y - p.y, e.x - p.x);
        if (Math.abs(angDiff(angTo, p.aim)) > 0.8) continue;
        canFire = true; break;
      }
      if (canFire) {
        p.reload = TANK_RELOAD;
        p.muzzle = 0.12;
        fireTankShell(p);
        shake(2);
        p.noTargetTimer = 0;
      } else {
        p.noTargetTimer = 0.6;
      }
    }
  } else {
    p.atkCd = Math.max(0, p.atkCd - dt);
    p.swing = Math.max(0, p.swing - dt);
    if ((mouseDown || keys.Space) && p.atkCd <= 0) {
      p.atkCd = 0.33;
      p.swing = 0.16;
      p.swingAng = p.aim;
      meleeSweep(p, p.aim, 78, 1.05, 24);
    }
  }
}

function updateTankAI(a, dt, enemies, all) {
  a.invuln = Math.max(0, a.invuln - dt);
  a.flash = Math.max(0, a.flash - dt);
  a.reload = Math.max(0, a.reload - dt);
  a.muzzle = Math.max(0, a.muzzle - dt);

  let target = null, bd = Infinity;
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    const dd = dist2(a, e);
    if (dd < bd) { bd = dd; target = e; }
  }
  if (!target) { a.vx = 0; a.vy = 0; return; }

  const distCenter = Math.sqrt(bd);

  let mx = 0, my = 0;
  if (distCenter > TANK_RANGE * 0.85) {
    const ang = Math.atan2(target.y - a.y, target.x - a.x);
    mx = Math.cos(ang);
    my = Math.sin(ang);
  }

  let sepX = 0, sepY = 0;
  for (const o of all) {
    if (o === a || o.hp <= 0) continue;
    const ex = a.x - o.x, ey = a.y - o.y;
    const ed2 = ex*ex + ey*ey;
    const minD = a.r + o.r + 6;
    if (ed2 < minD * minD && ed2 > 0.01) {
      const ed = Math.sqrt(ed2);
      const push = (minD - ed) / minD;
      sepX += (ex / ed) * push;
      sepY += (ey / ed) * push;
    }
  }
  mx += sepX * 1.2;
  my += sepY * 1.2;

  const m = Math.hypot(mx, my);
  if (m > 0.01) {
    a.vx = mx / m * a.speed;
    a.vy = my / m * a.speed;
    a.x += a.vx * dt;
    a.y += a.vy * dt;
  } else { a.vx = 0; a.vy = 0; }

  if (a.vx || a.vy) {
    a.hullAng = lerpAngle(a.hullAng, Math.atan2(a.vy, a.vx), dt * 8);
  }

  a.aim = Math.atan2(target.y - a.y, target.x - a.x);
  a.trackPhase += Math.hypot(a.vx, a.vy) * dt * 0.12;

  if (distCenter <= TANK_RANGE && a.reload <= 0) {
    a.reload = TANK_RELOAD;
    a.muzzle = 0.12;
    fireTankShell(a);
    shake(1.5);
  }

  a.x = clamp(a.x, a.r, WORLD_W - a.r);
  a.y = clamp(a.y, a.r, WORLD_H - a.r);
}

function updateAllies(dt) {
  const all = G.allies;
  const enemies = enemiesAlive();

  for (let i = 0; i < all.length; i++) {
    const a = all[i];
    if (a.hp <= 0) continue;

    if (a.kind === 'tank') {
      updateTankAI(a, dt, enemies, all);
      continue;
    }

    a.invuln = Math.max(0, a.invuln - dt);
    a.flash = Math.max(0, a.flash - dt);
    a.atkCd = Math.max(0, a.atkCd - dt);
    a.swing = Math.max(0, a.swing - dt);

    let target = null, bd = Infinity;
    for (const e of enemies) {
      const dd = dist2(a, e);
      if (dd < bd) { bd = dd; target = e; }
    }
    if (!target) { a.vx = 0; a.vy = 0; continue; }

    const d = Math.sqrt(bd) - target.r;

    let mx = 0, my = 0;
    if (d > 24) {
      const ang = Math.atan2(target.y - a.y, target.x - a.x);
      mx = Math.cos(ang);
      my = Math.sin(ang);
    }

    if (a.dodger) {
      const dv = getDodgeVector(a);
      const dm = Math.hypot(dv.x, dv.y);
      if (dm > 0.1) {
        const w = Math.min(0.9, dm * 1.3);
        mx = mx * (1 - w) + (dv.x / dm) * w;
        my = my * (1 - w) + (dv.y / dm) * w;
      }
    }

    let sepX = 0, sepY = 0;
    for (let j = 0; j < all.length; j++) {
      if (i === j) continue;
      const o = all[j];
      if (o.hp <= 0) continue;
      const ex = a.x - o.x, ey = a.y - o.y;
      const ed2 = ex*ex + ey*ey;
      const minD = a.r + o.r + 3;
      if (ed2 < minD * minD && ed2 > 0.01) {
        const ed = Math.sqrt(ed2);
        const push = (minD - ed) / minD;
        sepX += (ex / ed) * push;
        sepY += (ey / ed) * push;
      }
    }
    mx += sepX * 1.2;
    my += sepY * 1.2;

    const m = Math.hypot(mx, my);
    if (m > 0.01) {
      a.vx = mx / m * a.speed;
      a.vy = my / m * a.speed;
      a.x += a.vx * dt;
      a.y += a.vy * dt;
    } else { a.vx = 0; a.vy = 0; }

    if (d <= 24 && a.atkCd <= 0) {
      a.atkCd = 0.55;
      a.swing = 0.14;
      a.swingAng = Math.atan2(target.y - a.y, target.x - a.x);
      hurtEnemy(target, 7);
      burst(target.x, target.y, 2, '#9ff', 90);
    }

    a.x = clamp(a.x, a.r, WORLD_W - a.r);
    a.y = clamp(a.y, a.r, WORLD_H - a.r);
  }
}

function updateCoreAI(dt) {
  const c = G.core;
  if (c.hp <= 0) return;
  c.flash = Math.max(0, c.flash - dt);
  c.pulse += dt;

  const threats = friendlies();
  let fx = 0, fy = 0;
  for (const f of threats) {
    const dx = c.x - f.x, dy = c.y - f.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < 1) continue;
    const d = Math.sqrt(d2);
    const w = 1 / (d2 + 400);
    fx += (dx / d) * w * 8000;
    fy += (dy / d) * w * 8000;
  }

  const dbx = BASE_X - c.x, dby = BASE_Y - c.y;
  const db = Math.hypot(dbx, dby);
  if (db > 200) {
    const pull = (db - 200) / db * 3;
    fx += dbx / db * pull;
    fy += dby / db * pull;
  }

  c.wanderT -= dt;
  if (c.wanderT <= 0) {
    c.wanderT = rand(0.8, 1.8);
    c.wanderA = Math.random() * TAU;
  }
  fx += Math.cos(c.wanderA) * 0.7;
  fy += Math.sin(c.wanderA) * 0.7;

  const mag = Math.hypot(fx, fy);
  if (mag > 0.01) {
    c.vx = fx / mag * c.speed;
    c.vy = fy / mag * c.speed;
  } else { c.vx *= 0.9; c.vy *= 0.9; }

  c.x += c.vx * dt;
  c.y += c.vy * dt;
  c.x = clamp(c.x, c.r + 10, WORLD_W - c.r - 10);
  c.y = clamp(c.y, c.r + 10, WORLD_H - c.r - 10);

  const rage = 1 + (1 - c.hp / c.maxhp) * 0.85;
  const m = dmult();

  const T = c.timers;
  T.orb       -= dt * rage * m;
  T.lightning -= dt * rage * m;
  T.aimed     -= dt * rage * m;
  T.laser     -= dt * rage * m;
  T.ring      -= dt * rage * m;
  T.spiral    -= dt * rage * m;

  if (T.orb <= 0)       { T.orb = 4.6;       fireOrbs(c); }
  if (T.lightning <= 0) { T.lightning = 3.0; fireLightning(c); }
  if (T.aimed <= 0)     { T.aimed = 1.35;    fireAimed(c); }
  if (T.laser <= 0)     { T.laser = 5.4;     fireLasers(c); }
  if (T.ring <= 0)      { T.ring = 4.4;      fireRing(c); }
  if (T.spiral <= 0)    {
    T.spiral = 7.5;
    c.spiralLeft = Math.max(14, Math.round(30 * m));
    c.spiralAng = Math.random() * TAU;
    c.spiralTimer = 0;
  }

  if (c.spiralLeft > 0) {
    c.spiralTimer -= dt;
    let guard = 0;
    while (c.spiralTimer <= 0 && c.spiralLeft > 0 && guard++ < 8) {
      c.spiralTimer += 0.048 / Math.min(1.7, m);
      c.spiralLeft--;
      c.spiralAng += 0.34;
      fireSpiralShot(c);
    }
  }
}

function updateBullets(dt) {
  const list = friendlies();
  for (const b of G.bullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    if (b.x < -40 || b.x > WORLD_W + 40 || b.y < -40 || b.y > WORLD_H + 40) { b.dead = true; continue; }
    for (const f of list) {
      if (f.hp <= 0) continue;
      if (dist2(b, f) < (b.r + f.r) * (b.r + f.r)) {
        hurtFriendly(f, b.dmg);
        if (!b.pierce) { b.dead = true; break; }
      }
    }
  }
  G.bullets = G.bullets.filter(b => !b.dead);

  if (G.bullets.length > BULLET_CAP) {
    G.bullets.splice(0, G.bullets.length - BULLET_CAP);
  }
}

function updateOrbs(dt) {
  const c = G.core;
  const list = friendlies();
  for (const o of G.orbs) {
    o.a += o.angSpeed * dt;
    o.rad += o.radSpeed * dt;
    o.life -= dt;
    o.x = c.x + Math.cos(o.a) * o.rad;
    o.y = c.y + Math.sin(o.a) * o.rad;
    if (o.life <= 0 || o.rad > 460) { o.dead = true; continue; }
    for (const f of list) {
      if (f.hp <= 0) continue;
      if (dist2(o, f) < (o.r + f.r) * (o.r + f.r)) hurtFriendly(f, o.dmg);
    }
  }
  G.orbs = G.orbs.filter(o => !o.dead);
}

function updateWarnings(dt) {
  for (const w of G.warnings) {
    w.t -= dt;
    if (w.phase === 'warn' && w.t <= 0) {
      w.phase = 'hit';
      w.t = 0.28;
      shake(6);
      burst(w.x, w.y, 26, '#a0e6ff', 260);
      for (const f of friendlies()) {
        if (f.hp <= 0) continue;
        if (dist2(w, f) < (w.r + f.r) * (w.r + f.r)) hurtFriendly(f, 45);
      }
    } else if (w.phase === 'hit' && w.t <= 0) {
      w.dead = true;
    }
  }
  G.warnings = G.warnings.filter(w => !w.dead);
}

function updateLasers(dt) {
  for (const L of G.lasers) {
    L.t -= dt;
    if (L.phase === 'warn' && L.t <= 0) {
      L.phase = 'fire'; L.t = 0.45; shake(8);
    } else if (L.phase === 'fire') {
      const sinA = Math.sin(L.ang), cosA = Math.cos(L.ang);
      for (const f of friendlies()) {
        if (f.hp <= 0) continue;
        const ex = f.x - L.ox, ey = f.y - L.oy;
        const perp = Math.abs(-ex * sinA + ey * cosA);
        if (perp < L.w / 2 + f.r) hurtFriendly(f, 45);
      }
      if (L.t <= 0) L.dead = true;
    }
  }
  G.lasers = G.lasers.filter(l => !l.dead);
}

function updateParticles(dt) {
  for (const p of G.particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);
}

function updateCamera(dt) {
  if (!G.player) return;
  const vw = camViewW(), vh = camViewH();
  const tx = G.player.x - vw / 2;
  const ty = G.player.y - vh / 2;
  const k = Math.min(1, dt * 8);
  G.cam.x += (tx - G.cam.x) * k;
  G.cam.y += (ty - G.cam.y) * k;
  G.cam.x = clampCam(G.cam.x, vw, WORLD_W);
  G.cam.y = clampCam(G.cam.y, vh, WORLD_H);
}

function update(dt) {
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeAmt = 0; }
  shakeAmt *= 0.86;

  if (!G || G.state === 'menu') return;

  if (G.over) { G.overT += dt; updateParticles(dt); return; }

  G.t += dt;
  if (G.waveBanner > 0) G.waveBanner -= dt;

  updateWaves(dt);
  updatePlayer(dt);
  updateAllies(dt);
  updateTurrets(dt);
  updateCoreAI(dt);
  updateBullets(dt);
  updateShells(dt);
  updateOrbs(dt);
  updateWarnings(dt);
  updateLasers(dt);
  updateParticles(dt);
  updateCamera(dt);

  G.allies = G.allies.filter(a => a.hp > 0);
}

// ============================================================
//  描画
// ============================================================
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#07090d';
  ctx.fillRect(0, 0, W, H);

  if (!G || G.state === 'menu') { drawMenu(); return; }

  const sx = (Math.random() - 0.5) * shakeAmt;
  const sy = (Math.random() - 0.5) * shakeAmt;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, VIEW_W, VIEW_H);
  ctx.clip();

  ctx.translate(sx, sy);
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-G.cam.x, -G.cam.y);

  drawWorld();
  drawWarnings();
  drawLasers();
  drawTurrets();
  drawCore();
  drawOrbs();
  drawBullets();
  drawShells();
  drawAllies();
  drawPlayer();
  drawParticles();

  ctx.restore();

  drawOverlays();
  drawPanel();
}

function menuButtons() {
  const bw = Math.min(250, Math.max(108, (W - 90) / 3 - 18));
  const bh = 92;
  const gap = 18;
  const totalW = bw * 3 + gap * 2;
  const x0 = (W - totalW) / 2;
  const y0 = H * 0.44;
  const arr = [];
  for (let i = 0; i < 3; i++) arr.push({ x: x0 + i * (bw + gap), y: y0, w: bw, h: bh });
  return arr;
}
function startButtonRect() {
  const bw = Math.min(260, W - 120), bh = 56;
  return { x: (W - bw) / 2, y: H * 0.44 + 92 + 44, w: bw, h: bh };
}

function drawMenu() {
  const t = performance.now() / 1000;

  const bg = ctx.createRadialGradient(W / 2, H * 0.35, 40, W / 2, H * 0.5, Math.max(W, H) * 0.8);
  bg.addColorStop(0, '#121826');

  ctx.strokeStyle = 'rgba(80,140,190,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();

  ctx.stroke();

  for (let i = 0; i < 26; i++) {

  ctx.textAlign = 'center';

  ctx.fillStyle = '#ff6f9c';

  ctx.font = 'bold 15px system-ui';
  ctx.fillStyle = 'rgba(160,190,215,0.85)';
  ctx.fillText('D E A T H   G A M E   ─   C O R E   B R E A K E R', W / 2, H * 0.20 + 34);

  ctx.font = '14px system-ui';
  ctx.fillStyle = '#7cf5c4';

  const btns = menuButtons();
  for (let i = 0; i < 3; i++) {
    const b = btns[i];

    const sel = i === diffIndex;
    const hov = mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h;

    if (sel) {
      const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);

      g.addColorStop(1, 'rgba(255,111,156,0.05)');

    } else {

      ctx.fillStyle = 'rgba(255,74,110,0.95)';
      ctx.fillText('※ 激ムズ', b.x + b.w / 2, b.y + b.h - 16);

  const sg = ctx.createLinearGradient(sb.x, sb.y, sb.x, sb.y + sb.h);

  sg.addColorStop(1, 'rgba(255,61,110,0.12)');
  ctx.fillStyle = sg;
  roundRectPath(ctx, sb.x, sb.y, sb.w, sb.h, 12);
  ctx.fill();

  ctx.font = 'bold 22px system-ui';
  ctx.fillStyle = '#ffe3ec';
  ctx.fillText('START', sb.x + sb.w / 2, sb.y + sb.h / 2 + 8);

  ctx.fillStyle = 'rgba(150,175,200,0.62)';
  ctx.fillText('1 / 2 / 3 または ← → で選択　　クリック / Enter で開始', W / 2, H - 78);
  ctx.fillStyle = 'rgba(150,175,200,0.45)';
  ctx.fillText('WASD / 矢印:移動　　左クリック / Space:近接　　F:フルスクリーン', W / 2, H - 52);

  ctx.textAlign = 'left';
}

//  ワールド描画
// ------------------------------------------------------------
function drawWorld() {
  const vw = camViewW(), vh = camViewH();
  const x0 = G.cam.x - 120, y0 = G.cam.y - 120;
  const x1 = G.cam.x + vw + 120, y1 = G.cam.y + vh + 120;

  ctx.strokeStyle = '#151a24';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const gx0 = Math.floor(x0 / 48) * 48;
  const gy0 = Math.floor(y0 / 48) * 48;
  for (let x = gx0; x < x1; x += 48) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
  for (let y = gy0; y < y1; y += 48) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();

  const g = ctx.createLinearGradient(WORLD_W - 900, 0, WORLD_W, 0);
  g.addColorStop(0, 'rgba(160,30,60,0)');
  g.addColorStop(1, 'rgba(160,30,60,0.18)');
  ctx.fillStyle = g;
  ctx.fillRect(WORLD_W - 900, 0, 900, WORLD_H);

  const g2 = ctx.createLinearGradient(0, 0, 320, 0);
  g2.addColorStop(0, 'rgba(40,120,90,0.14)');
  g2.addColorStop(1, 'rgba(40,120,90,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, 320, WORLD_H);

  ctx.strokeStyle = 'rgba(255,80,120,0.10)';
  ctx.lineWidth = 2;
  ctx.setLineDash([20, 20]);
  ctx.beginPath(); ctx.arc(BASE_X, BASE_Y, 500, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = 'rgba(255,60,100,0.35)';
  ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, WORLD_W, WORLD_H);
}

function drawTurrets() {
  for (const t of G.turrets) {
    if (t.hp <= 0) {
      ctx.fillStyle = '#22262e';
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r * 0.7, 0, TAU); ctx.fill();
      continue;
    }
    const s = TURRET_STYLES[t.style];

    const barrelLen = t.r + 18 + (t.muzzle > 0 ? 4 : 0);
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.aimAng);
    ctx.fillStyle = t.flash > 0 ? '#fff' : '#2a1a20';
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.rect(t.r * 0.3, -4, barrelLen - t.r * 0.3, 8);
    ctx.fill(); ctx.stroke();
    if (t.muzzle > 0) {
      const k = t.muzzle / 0.07;
      ctx.fillStyle = `rgba(255,220,120,${k})`;
      ctx.beginPath(); ctx.arc(barrelLen + 4, 0, 9 * k, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${k * 0.9})`;
      ctx.beginPath(); ctx.arc(barrelLen + 4, 0, 4 * k, 0, TAU); ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.fillStyle = t.flash > 0 ? '#fff' : '#4a2a34';
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, t.r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(0, 0, t.r * 0.42, 0, TAU); ctx.fill();
    ctx.restore();

    const w = 44;
    ctx.fillStyle = 'rgba(0,0,0,0.67)';
    ctx.fillRect(t.x - w / 2, t.y - t.r - 14, w, 5);
    ctx.fillStyle = s.color;
    ctx.fillRect(t.x - w / 2, t.y - t.r - 14, w * (t.hp / t.maxhp), 5);
  }
}

function drawCore() {
  const c = G.core;
  if (c.hp <= 0) return;
  const pulse = 1 + Math.sin(c.pulse * 4) * 0.15;

  const rg = ctx.createRadialGradient(c.x, c.y, 8, c.x, c.y, 120);
  rg.addColorStop(0, 'rgba(255,60,120,0.38)');
  rg.addColorStop(1, 'rgba(255,60,120,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(c.x, c.y, 120, 0, TAU); ctx.fill();

  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.pulse * 0.9);
  ctx.strokeStyle = 'rgba(255,120,180,0.65)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.fillStyle = c.flash > 0 ? '#fff' : '#3a1020';
  ctx.strokeStyle = '#ff3d6e';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(c.x, c.y, c.r * pulse, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff3d6e';
  ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 0.5 * pulse, 0, TAU); ctx.fill();

  const w = 50;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(c.x - w/2 - 1, c.y - c.r - 16, w + 2, 6);
  ctx.fillStyle = '#ff3d6e';
  ctx.fillRect(c.x - w/2, c.y - c.r - 15, w * (c.hp / c.maxhp), 4);
}

function drawBullets() {
  if (G.bullets.length === 0) return;

  const vx0 = G.cam.x - 40, vy0 = G.cam.y - 40;
  const vx1 = G.cam.x + camViewW() + 40;
  const vy1 = G.cam.y + camViewH() + 40;

  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.55;
  for (const b of G.bullets) {
    if (!b.tracer) continue;
    if (b.x < vx0 || b.x > vx1 || b.y < vy0 || b.y > vy1) continue;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp < 1) continue;
    const nx = b.vx / sp, ny = b.vy / sp;
    ctx.strokeStyle = b.color;
    ctx.lineWidth = b.r * 1.4;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - nx * b.tracer, b.y - ny * b.tracer);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.globalAlpha = 0.30;
  for (const b of G.bullets) {
    if (b.x < vx0 || b.x > vx1 || b.y < vy0 || b.y > vy1) continue;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.9, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const b of G.bullets) {
    if (b.x < vx0 || b.x > vx1 || b.y < vy0 || b.y > vy1) continue;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for (const b of G.bullets) {
    if (b.x < vx0 || b.x > vx1 || b.y < vy0 || b.y > vy1) continue;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, TAU); ctx.fill();
  }

  ctx.lineCap = 'butt';
}

function drawShells() {
  for (const s of G.shells) {
    const sp = Math.hypot(s.vx, s.vy);
    if (sp > 1) {
      const nx = s.vx / sp, ny = s.vy / sp;
      ctx.strokeStyle = 'rgba(255,220,120,0.35)';
      ctx.lineWidth = s.r * 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - nx * 22, s.y - ny * 22);
      ctx.stroke();
      ctx.lineCap = 'butt';
    }
    ctx.fillStyle = 'rgba(255,225,130,0.30)';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffe28a';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.45, 0, TAU); ctx.fill();
  }
}

function drawOrbs() {
  for (const o of G.orbs) {
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#ff6fbe';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 1.8, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,110,190,0.9)';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 0.4, 0, TAU); ctx.fill();
  }
}

function drawWarnings() {
  for (const w of G.warnings) {
    if (w.phase === 'warn') {
      const k = 1 - w.t / w.max;
      ctx.strokeStyle = `rgba(120,220,255,${0.22 + 0.35 * k})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(w.sx, w.sy);
      ctx.lineTo(w.x, w.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = `rgba(140,230,255,${0.5 + 0.5 * k})`;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.stroke();
      ctx.fillStyle = `rgba(120,210,255,${0.10 + 0.18 * k})`;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r * k, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.fill();
    } else {
      const k = w.t / 0.28;
      ctx.fillStyle = `rgba(190,245,255,${0.85 * k})`;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r * (1.05 - k * 0.25), 0, TAU); ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255,${k})`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.stroke();
    }
  }
}

function drawLasers() {
  if (G.lasers.length === 0) return;

  const margin = 100;
  const vx0 = G.cam.x - margin;
  const vy0 = G.cam.y - margin;
  const vx1 = G.cam.x + camViewW() + margin;
  const vy1 = G.cam.y + camViewH() + margin;

  for (const L of G.lasers) {
    const dx = Math.cos(L.ang), dy = Math.sin(L.ang);
    const seg = clipLineToRect(L.ox, L.oy, dx, dy, vx0, vy0, vx1, vy1, LASER_LEN);
    if (!seg) continue;

    const ax = L.ox + dx * seg[0], ay = L.oy + dy * seg[0];
    const bx = L.ox + dx * seg[1], by = L.oy + dy * seg[1];

    if (L.phase === 'warn') {
      const k = 1 - L.t / L.max;

      ctx.strokeStyle = `rgba(255,90,190,${0.22 + 0.45 * k})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
      ctx.setLineDash([]);

      if (L.ox > vx0 && L.ox < vx1 && L.oy > vy0 && L.oy < vy1) {
        ctx.fillStyle = `rgba(255,120,210,${0.35 + 0.45 * k})`;
        ctx.beginPath();
        ctx.arc(L.ox, L.oy, 10 + 8 * k, 0, TAU);
        ctx.fill();
      }
    } else {
      const k = clamp(L.t / 0.45, 0, 1);
      const w = L.w * (0.4 + 0.6 * k);

      ctx.lineCap = 'round';

      ctx.strokeStyle = 'rgba(255,90,200,0.14)';
      ctx.lineWidth = w * 2.6;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();

      ctx.strokeStyle = 'rgba(255,110,210,0.30)';
      ctx.lineWidth = w * 1.6;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();

      ctx.strokeStyle = 'rgba(255,130,220,0.88)';
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();

      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = Math.max(1.5, w * 0.32);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();

      ctx.lineCap = 'butt';
    }
  }
}

// ------------------------------------------------------------
//  戦車の描画（原色の光のエネルギー体）
// ------------------------------------------------------------
function drawTank(t, C, isPlayer) {
  const hullL = 46, hullW = 28;
  const trackW = 9, trackL = hullL + 4;
  const trackOffsetY = hullW / 2 + trackW / 2 - 1;

  const pulse = 0.72 + 0.28 * Math.sin(G.t * 7 + (t.x + t.y) * 0.01);

  // ---- 外周のオーラ ----
  const auraR = 54;
  const ag = ctx.createRadialGradient(t.x, t.y, 4, t.x, t.y, auraR);
  ag.addColorStop(0, C.glow);
  ag.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.55 + 0.45 * pulse;
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(t.x, t.y, auraR, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.translate(t.x, t.y);

  // ===== 車体 =====
  ctx.save();
  ctx.rotate(t.hullAng);

  // 履帯：光の帯
  ctx.lineCap = 'round';
  for (const side of [-1, 1]) {
    const ty = side * trackOffsetY;

    // 発光
    ctx.strokeStyle = C.trackGlow;
    ctx.lineWidth = trackW * 2.1;
    ctx.beginPath(); ctx.moveTo(-trackL/2, ty); ctx.lineTo(trackL/2, ty); ctx.stroke();

    // 芯
    ctx.strokeStyle = C.trackLine;
    ctx.lineWidth = trackW * 0.65;
    ctx.beginPath(); ctx.moveTo(-trackL/2, ty); ctx.lineTo(trackL/2, ty); ctx.stroke();

    // 流れる光のセグメント
    ctx.setLineDash([4, 8]);
    ctx.lineDashOffset = -t.trackPhase * 6;
    ctx.strokeStyle = C.dash;
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(-trackL/2, ty); ctx.lineTo(trackL/2, ty); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
  }
  ctx.lineCap = 'butt';

  // 車体：半透明の発光体
  ctx.fillStyle = C.hullFill;
  roundRectPath(ctx, -hullL/2, -hullW/2, hullL, hullW, 6);
  ctx.fill();

  ctx.strokeStyle = C.hullLine;
  ctx.lineWidth = 2;
  ctx.stroke();

  // 内側の光のライン
  ctx.strokeStyle = C.hullInner;
  ctx.lineWidth = 1.2;
  roundRectPath(ctx, -hullL/2 + 4, -hullW/2 + 4, hullL - 8, hullW - 8, 4);
  ctx.stroke();

  // 前面装甲の発光ライン
  ctx.strokeStyle = C.hullInner;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(hullL/2 - 9, -hullW/2 + 5);
  ctx.lineTo(hullL/2 - 9, hullW/2 - 5);
  ctx.stroke();

  // 側面のエネルギーライン
  ctx.strokeStyle = C.hullInner;
  ctx.lineWidth = 1;
  ctx.globalAlpha = pulse;
  ctx.beginPath();
  ctx.moveTo(-hullL/2 + 8, 0);
  ctx.lineTo(hullL/2 - 12, 0);
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.restore(); // 車体回転

  // ===== 砲塔 =====
  ctx.save();
  ctx.rotate(t.aim);

  // 砲身：光のビーム
  const barrelLen = 34;
  const bx0 = 6, bx1 = 6 + barrelLen;

  ctx.lineCap = 'round';
  // 外側グロー
  ctx.strokeStyle = C.barrelGlow;
  ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(bx0, 0); ctx.lineTo(bx1, 0); ctx.stroke();
  // 芯の光
  ctx.strokeStyle = C.barrel;
  ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.moveTo(bx0, 0); ctx.lineTo(bx1, 0); ctx.stroke();
  ctx.lineCap = 'butt';

  // マズルリング
  ctx.strokeStyle = C.barrel;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(bx1 - 4, 0, 5.5, 0, TAU); ctx.stroke();

  // 砲塔基部：光の球
  const tg = ctx.createRadialGradient(0, 0, 1, 0, 0, 15);
  tg.addColorStop(0, C.hatch);
  tg.addColorStop(0.40, C.turretFill);
  tg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = tg;
  ctx.beginPath(); ctx.arc(0, 0, 15, 0, TAU); ctx.fill();

  ctx.strokeStyle = C.turretLine;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.stroke();

  // ハッチの光点
  ctx.fillStyle = C.hatch;
  ctx.beginPath(); ctx.arc(-1.5, 0, 2.4 * pulse, 0, TAU); ctx.fill();

  // 発射光
  if (t.muzzle > 0) {
    const k = t.muzzle / 0.12;
    const mx = bx1 + 6;

    const mg = ctx.createRadialGradient(mx, 0, 1, mx, 0, 24 * k);
    mg.addColorStop(0, 'rgba(255,255,255,' + (0.95 * k) + ')');
    mg.addColorStop(0.35, 'rgba(255,238,160,' + (0.7 * k) + ')');
    mg.addColorStop(1, 'rgba(255,190,70,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mx, 0, 24 * k, 0, TAU); ctx.fill();

    // 十字の光条
    ctx.strokeStyle = 'rgba(255,255,225,' + (0.9 * k) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(mx - 14 * k, 0); ctx.lineTo(mx + 14 * k, 0);
    ctx.moveTo(mx, -14 * k);    ctx.lineTo(mx, 14 * k);
    ctx.stroke();
  }

  ctx.restore(); // 砲塔回転

  // 被弾フラッシュ
  if (t.flash > 0) {
    ctx.globalAlpha = Math.min(0.9, t.flash * 5.5);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // プレイヤーのHPリング
  if (isPlayer) {
    ctx.strokeStyle = C.hpRing;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 28, -Math.PI / 2, -Math.PI / 2 + TAU * (t.hp / t.maxhp));
    ctx.stroke();
  }

  ctx.restore();
}

// ------------------------------------------------------------
//  味方の描画
// ------------------------------------------------------------
function drawAllies() {
  for (const a of G.allies) {
    if (a.hp <= 0) continue;

    if (a.kind === 'tank') {
      drawTank(a, ALLY_TANK_COLORS, false);
      continue;
    }

    if (a.swing > 0) {
      const k = a.swing / 0.14;
      ctx.strokeStyle = `rgba(150,255,220,${0.7 * k})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(a.x, a.y, 26, a.swingAng - 0.9, a.swingAng + 0.9);
      ctx.stroke();
    }
    ctx.fillStyle = a.flash > 0 ? '#fff' : (a.invuln > 0 ? '#2f6b5a' : '#3fd6a6');
    ctx.strokeStyle = '#0c2a22';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, TAU); ctx.fill(); ctx.stroke();

    if (a.dodger) {
      ctx.strokeStyle = 'rgba(210,255,160,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r + 3, 0, TAU); ctx.stroke();
    }
  }
}

function drawPlayer() {
  const p = G.player;
  if (!p) {
    const k = 1 - G.playerRespawn / 2.0;
    ctx.strokeStyle = `rgba(120,220,255,${0.3 + 0.4 * k})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(SPAWN_X, SPAWN_Y, 24 * k + 8, 0, TAU); ctx.stroke();
    return;
  }

  if (p.isTank) {
    // 射程サークル
    ctx.strokeStyle = 'rgba(255,216,58,0.14)';
    ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.arc(p.x, p.y, TANK_RANGE, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);

    drawTank(p, PLAYER_TANK_COLORS, true);

    if (p.noTargetTimer > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 11px system-ui';
      ctx.fillStyle = `rgba(255,140,140,${Math.min(1, p.noTargetTimer * 2)})`;
      ctx.fillText('OUT OF RANGE', p.x, p.y - 44);
    }
    return;
  }

  if (p.swing > 0) {
    const k = p.swing / 0.16;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.swingAng);
    ctx.strokeStyle = `rgba(140,240,255,${0.85 * k})`;
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(0, 0, 60, -0.85, 0.85); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${0.9 * k})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 60, -0.85, 0.85); ctx.stroke();
    ctx.restore();
  }

  ctx.strokeStyle = 'rgba(120,220,255,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + Math.cos(p.aim) * 60, p.y + Math.sin(p.aim) * 60);
  ctx.stroke();

  ctx.fillStyle = p.flash > 0 ? '#fff' : (p.invuln > 0 && Math.floor(p.invuln * 20) % 2 ? '#1b4a5e' : '#4fd8ff');
  ctx.strokeStyle = '#0a2430';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); ctx.stroke();

  ctx.strokeStyle = '#4fd8ff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r + 6, -Math.PI / 2, -Math.PI / 2 + TAU * (p.hp / p.maxhp));
  ctx.stroke();
}

function drawParticles() {
  for (const p of G.particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
//  オーバーレイ
// ============================================================
function drawOverlays() {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, VIEW_W, VIEW_H);
  ctx.clip();

  if (G.waveBanner > 0 && !G.over) {
    const k = Math.min(1, G.waveBanner);
    ctx.textAlign = 'center';
    ctx.font = 'bold 44px system-ui';
    ctx.fillStyle = `rgba(255,180,200,${k})`;
    ctx.shadowColor = 'rgba(255,60,120,0.8)';
    ctx.shadowBlur = 20;
    ctx.fillText('WAVE ' + G.wave, VIEW_W / 2, 130);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 16px system-ui';
    ctx.fillStyle = `rgba(255,140,180,${k * 0.9})`;
    ctx.fillText('援軍 到着', VIEW_W / 2, 158);
  }

  if (G.over) {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.75, G.overT) + ')';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff6f9c';
    ctx.font = 'bold 48px system-ui';
    ctx.fillText('拠点破壊 成功', VIEW_W / 2, VIEW_H / 2 - 60);
    ctx.fillStyle = '#cfe';
    ctx.font = 'bold 20px system-ui';
    ctx.fillText('味方 累計戦死者  ' + G.allyDeaths + ' 体', VIEW_W / 2, VIEW_H / 2 - 4);
    ctx.fillText('自機戦死  ' + G.playerDeaths + ' 回', VIEW_W / 2, VIEW_H / 2 + 28);
    ctx.fillText('到達ウェーブ  ' + G.wave + ' / 所要 ' + G.t.toFixed(1) + ' 秒', VIEW_W / 2, VIEW_H / 2 + 60);
    ctx.fillStyle = 'rgba(255,180,210,0.9)';
    ctx.font = 'bold 16px system-ui';
    ctx.fillText('難易度  ' + DIFFICULTY[diffIndex].label, VIEW_W / 2, VIEW_H / 2 + 92);
    ctx.fillStyle = 'rgba(200,220,240,0.7)';
    ctx.font = '16px system-ui';
    ctx.fillText('R キーでメニューへ', VIEW_W / 2, VIEW_H / 2 + 136);
  }

  ctx.restore();
}

// ============================================================
//  サイドパネル
// ============================================================
function drawPanel() {
  const px = VIEW_W, pw = PANEL_W, pad = 14;
  const innerW = pw - pad * 2;

  ctx.save();
  ctx.beginPath();
  ctx.rect(px, 0, pw, H);
  ctx.clip();

  const bg = ctx.createLinearGradient(px, 0, px + pw, 0);
  bg.addColorStop(0, '#0c1119');
  bg.addColorStop(1, '#090b10');
  ctx.fillStyle = bg;
  ctx.fillRect(px, 0, pw, H);

  ctx.strokeStyle = 'rgba(120,220,255,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(px + 0.5, 0); ctx.lineTo(px + 0.5, H); ctx.stroke();

  ctx.textAlign = 'left';
  ctx.font = 'bold 11px system-ui';
  ctx.fillStyle = 'rgba(120,200,235,0.65)';
  ctx.fillText('DANMAKU  BASE  BREAKER', px + pad, 22);

  const dm = DIFFICULTY[diffIndex];
  ctx.font = 'bold 11px system-ui';
  ctx.fillStyle = dm.color;
  ctx.fillText('難易度  ' + dm.label, px + pad, 42);

  let y = 66;

  ctx.font = 'bold 24px system-ui';
  ctx.fillStyle = '#ffb0c8';
  ctx.fillText('WAVE ' + G.wave, px + pad, y + 6);
  y += 20;

  const wt = 1 - clamp(G.waveTimer / Math.max(0.01, G.waveInterval), 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(px + pad, y, innerW, 5);
  ctx.fillStyle = '#ff6f9c';
  ctx.fillRect(px + pad, y, innerW * wt, 5);
  y += 8;
  ctx.font = '11px system-ui';
  ctx.fillStyle = 'rgba(150,170,190,0.8)';
  ctx.fillText('次の援軍まで ' + Math.max(0, G.waveTimer).toFixed(1) + ' 秒', px + pad, y + 10);
  y += 30;

  ctx.font = 'bold 11px system-ui';
  ctx.fillStyle = 'rgba(140,200,180,0.8)';
  ctx.fillText('味方 累計戦死者', px + pad, y);
  y += 36;
  ctx.font = 'bold 38px system-ui';
  ctx.fillStyle = '#3fd6a6';
  ctx.fillText(String(G.allyDeaths), px + pad, y);
  y += 18;

  let dodgers = 0, tanks = 0;
  for (const a of G.allies) {
    if (a.hp <= 0) continue;
    if (a.dodger) dodgers++;
    if (a.kind === 'tank') tanks++;
  }

  ctx.font = '12px system-ui';
  ctx.fillStyle = '#9ab';
  ctx.fillText('生存味方  ' + G.allies.length + ' / ' + ALLY_CAP, px + pad, y); y += 18;
  ctx.fillStyle = '#d6ff9a';
  ctx.fillText('回避型BOT  ' + dodgers, px + pad, y); y += 18;
  ctx.fillStyle = '#5fb0ff';
  ctx.fillText('戦車(青)  ' + tanks + ' / ' + TANK_COUNTS[diffIndex], px + pad, y); y += 18;
  ctx.fillStyle = '#9ab';
  ctx.fillText('自機戦死  ' + G.playerDeaths + ' 回', px + pad, y); y += 18;
  ctx.fillText('経過  ' + G.t.toFixed(1) + ' 秒', px + pad, y); y += 22;

  const mmMaxH = Math.max(50, H - y - 165);
  let mmW = innerW;
  let mmH = Math.round(mmW * WORLD_H / WORLD_W);
  if (mmH > mmMaxH) {
    mmH = mmMaxH;
    mmW = Math.round(mmH * WORLD_W / WORLD_H);
  }
  const mmX = px + pad + (innerW - mmW) / 2;
  drawMinimap(mmX, y, mmW, mmH);
  y += mmH + 22;

  if (G.core.hp > 0) {
    ctx.font = 'bold 11px system-ui';
    ctx.fillStyle = 'rgba(255,140,180,0.9)';
    ctx.fillText('CORE', px + pad, y);
    y += 8;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(px + pad, y, innerW, 12);
    ctx.fillStyle = '#2a0a14';
    ctx.fillRect(px + pad, y, innerW, 12);
    ctx.fillStyle = '#ff3d6e';
    ctx.fillRect(px + pad, y, innerW * (G.core.hp / G.core.maxhp), 12);
    y += 22;
    ctx.font = 'bold 12px system-ui';
    ctx.fillStyle = '#ffd0dd';
    ctx.fillText(Math.ceil(G.core.hp) + ' / ' + G.core.maxhp, px + pad, y);
  }

  ctx.textAlign = 'left';
  ctx.font = '11px system-ui';
  ctx.fillStyle = 'rgba(150,170,190,0.55)';
  ctx.fillText('WASD / 矢印      移動', px + pad, H - 62);
  ctx.fillText('左クリック / Space  攻撃', px + pad, H - 44);
  ctx.fillStyle = 'rgba(150,220,255,0.75)';
  ctx.fillText('F  フルスクリーン切替', px + pad, H - 26);

  ctx.restore();
}

function drawMinimap(mx, my, mw, mh) {
  const sx = mw / WORLD_W, sy = mh / WORLD_H;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(mx - 2, my - 2, mw + 4, mh + 4);
  ctx.fillStyle = 'rgba(15,20,30,0.95)';
  ctx.fillRect(mx, my, mw, mh);

  const g = ctx.createLinearGradient(mx + mw * 0.62, 0, mx + mw, 0);
  g.addColorStop(0, 'rgba(160,30,60,0)');
  g.addColorStop(1, 'rgba(160,30,60,0.35)');
  ctx.fillStyle = g;
  ctx.fillRect(mx + mw * 0.62, my, mw * 0.38, mh);

  ctx.strokeStyle = 'rgba(255,80,120,0.18)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(mx + BASE_X * sx, my + BASE_Y * sy, 500 * sx, 0, TAU);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(120,220,255,0.6)';
  ctx.strokeRect(
    mx + G.cam.x * sx, my + G.cam.y * sy,
    Math.min(mw, camViewW() * sx), Math.min(mh, camViewH() * sy)
  );

  for (const a of G.allies) {
    if (a.hp <= 0) continue;
    if (a.kind === 'tank') {
      ctx.fillStyle = '#5fb0ff';
      ctx.fillRect(mx + a.x * sx - 2, my + a.y * sy - 2, 4, 4);
    } else {
      ctx.fillStyle = a.dodger ? '#d6ff9a' : '#3fd6a6';
      ctx.fillRect(mx + a.x * sx - 1, my + a.y * sy - 1, 2, 2);
    }
  }

  for (const t of G.turrets) {
    if (t.hp <= 0) continue;
    ctx.fillStyle = TURRET_STYLES[t.style].color;
    ctx.fillRect(mx + t.x * sx - 2, my + t.y * sy - 2, 4, 4);
  }

  if (G.core.hp > 0) {
    const cxp = mx + G.core.x * sx, cyp = my + G.core.y * sy;
    ctx.fillStyle = '#ff3d6e';
    ctx.beginPath(); ctx.arc(cxp, cyp, 4, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,61,110,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cxp, cyp, 8, 0, TAU); ctx.stroke();
  }

  if (G.player) {
    ctx.fillStyle = G.player.isTank ? '#ffd83a' : '#4fd8ff';
    ctx.beginPath();
    ctx.arc(mx + G.player.x * sx, my + G.player.y * sy, 3, 0, TAU);
    ctx.fill();
  }

  ctx.strokeStyle = 'rgba(120,220,255,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(mx + 0.5, my + 0.5, mw - 1, mh - 1);
}

// ============================================================
//  ループ
// ============================================================
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
reset();
requestAnimationFrame(loop);
</script>
</body>
